# Playground policy 2 of 3: a stricter profile, and the one to delete when you
# try Git-driven deletion (remove this file, then plan and apply).
#
# Safe on any tenant: enabled is false, so the policy exists but does nothing.
apiVersion: config.aquasec.com/v1alpha1
kind: RuntimePolicy
metadata:
  name: casc-playground-strict
spec:
  description: aquasec-casc playground -- safe to delete
  enabled: false                      # inert: change only on a tenant you own
  enforce: true
  runtimeType: container
  applicationScopes:
    - Global
  controls:
    blockNonCompliantImages: true
    blockNonCompliantResources: true
    blockContainerExec:
      allowedProcesses:
        # the console's default: AWS ECS Exec's agents
        - /ecs-execute-command-*/amazon-ssm-agent
        - /ecs-execute-command-*/ssm-session-worker
        - /ecs-execute-command-*/ssm-agent-worker
    blockReverseShell: true
    blockFilelessExec: true
    blockCryptocurrencyMining: true
    portScanningDetection: true
    driftPrevention: true
