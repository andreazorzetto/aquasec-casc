[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasec-casc"
version = "0.1.0"
description = "Config-as-code for Aqua Security: canonical YAML schema, reconciler, and run-once CLI for GitOps workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrea Zorzetto" }]

# Pinned deliberately: this ships as a single mirrorable image into an air-gapped
# environment, where "resolves to whatever is latest" is not a thing that can happen.
dependencies = [
    # The Aqua API client. 0.14.2 is the first with Tanzu assurance policies, and
    # that lets a client refuse redirects and verifies TLS on every sign-in path.
    "aquasec==0.14.2",
    "pydantic==2.13.4",
    "PyYAML==6.0.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pyflakes==3.2.0",
]

[project.scripts]
aquasec-casc = "aquasec_casc.cli.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
