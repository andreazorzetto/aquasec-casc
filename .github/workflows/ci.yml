name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q tests/unit
      - name: The examples are valid
        run: |
          aquasec-casc validate -f examples/playground
          aquasec-casc validate -f examples/two-scope

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t aquasec-casc:ci .
      - name: It runs as built, on a read-only filesystem, with no network
        run: docker run --rm --read-only --network none aquasec-casc:ci --help
