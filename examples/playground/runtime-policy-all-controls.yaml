# Playground policy 3 of 3: every control in the console's list for container
# policies, switched on, in enforce mode.
#
# Safe on any tenant: enabled is false, so the policy exists but does nothing.
# Enabled for real, it would block most workloads (only registered, compliant,
# recent images; no exec; only "cat" may run): it is a reference for what each
# control is called, not a policy to roll out.
#
# Names are the console's labels in camelCase. A control left out is off.
#
# Not here, on purpose:
#   Fork Guard                                  deprecated by Aqua
#   Bypass Scope                                Aqua's default policies only
#   Secure AI - Protection                      needs prompt protection set up
#                                               first; not covered by the tool
apiVersion: config.aquasec.com/v1alpha1
kind: RuntimePolicy
metadata:
  name: casc-playground-all-controls
spec:
  description: aquasec-casc playground -- every control on; safe to delete
  enabled: false                      # inert: change only on a tenant you own
  enforce: true
  runtimeType: container
  applicationScopes:
    - Global
  controls:
    # Images and workloads
    blockNonCompliantImages: true
    blockNonCompliantResources: true
    blockUnregisteredImages: true
    blockNonKubernetesContainers: true
    # Processes
    blockContainerExec:
      allowedProcesses:
        # the console's default: AWS ECS Exec's agents
        - /ecs-execute-command-*/amazon-ssm-agent
        - /ecs-execute-command-*/ssm-session-worker
        - /ecs-execute-command-*/ssm-agent-worker
    blockReverseShell:
      allowedProcesses: ["sshd"]
      whitelistedIps: ["10.0.0.0/8"]
    blockFilelessExec:
      allowedProcesses: ["python*"]
    limitNewPrivileges: true
    driftPrevention:
      includeScriptFiles: true
      allowedProcesses: ["redis-*"]
      applyToChildProcesses: true
    # Network and behaviour
    blockCryptocurrencyMining: true
    dnsIpReputation: true
    portScanningDetection: true

    # --- with settings: writing a setting switches the control on -------------
    limitContainerPrivileges:
      privileged: true
      hostNetwork: true
      hostPid: true
      hostIpc: true
      hostUts: true
      hostUserNamespace: true
      rootUser: true
      lowPortBinding: true
      addCapabilities: true
    capabilitiesBlock:                 # enforce mode only, in the console
      dropCapabilities: ["NET_RAW", "SYS_ADMIN", "SYS_PTRACE"]
    executablesBlocked:
      executables: ["nc", "ncat", "wget", "curl"]
    executablesAllowed:
      executables: ["cat"]
    registriesAllowed:
      registries: ["Docker Hub"]
    volumesBlocked:
      volumes: ["/", "/boot", "/dev", "/etc", "/proc", "/sys", "/var/run/docker.sock"]
    blockOutdatedImages:
      olderThan: 6
      unit: months
    portBlock:
      blockedInboundPorts: ["22", "23"]
      blockedOutboundPorts: ["25", "6667"]
    fileBlock:
      files: ["/etc/shadow", "/root/.ssh/*"]
    packageBlock:
      packages: ["netcat*", "nmap"]
    fileIntegrityMonitoring:
      create: true
      modify: true
      delete: true
      monitor:                         # the console's Monitor tab
        paths: ["/etc/*", "/bin/*", "/usr/bin/*"]
      exclude:                         # and its Exclude tab
        paths: ["/etc/hosts", "/etc/resolv.conf"]
    realTimeMalwareProtection:
      action: block
      excludedPaths: ["/proc/*", "/sys/*"]
      collectForensicFiles: true
      collectSelectiveMemoryDumps: true
    forensics:
      allProcesses: true
      fullCommandArguments: true
      allNetwork: true
    systemIntegrityMonitoring:
      systemTime: true
    # Secure AI: audit only. The console switches these off in enforce mode;
    # Aqua keeps them as written, so they are stored as written here too.
    secureAiDiscovery:
      ignoreList: ["OpenAI@gpt-4o-mini"]   # Service@model; Service@* for all its models
    secureAiUnauthorizedModels:
      models: ["DeepSeek@*", "Inference-Server@*"]
