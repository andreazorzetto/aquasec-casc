# Copy to .github/workflows/ in the repository that holds your configuration.
#
#   pull request: validate, then plan -- the plan is in the job's log.
#   merge to main: apply.
#
# Secrets (Settings > Secrets and variables > Actions):
#   AQUA_URL, AQUA_USER, AQUA_PASSWORD      self-hosted Aqua: the account that can write
#   AQUA_READONLY_USER, AQUA_READONLY_PASSWORD   an account that can only read
#   (for SaaS, AQUA_API_KEY, AQUA_API_SECRET, AQUA_API_ENDPOINT and AQUA_ROLE instead)
#
# A self-hosted Aqua that GitHub's runners cannot reach needs a self-hosted runner.
#
# Anyone who can open a pull request from a branch of this repository can change this
# workflow, and with it read these secrets. So give the plan job a read-only Aqua
# account, and keep the account that can write behind a protected Environment:
# Settings > Environments > aqua-production, with required reviewers.
name: Aqua configuration
on:
  pull_request:
    paths: ["aqua/policies/**"]
  push:
    branches: [main]
    paths: ["aqua/policies/**"]

permissions:
  contents: read

env:
  # Mirror this into your own registry, and pin it by digest.
  IMAGE: andreazorzetto/aquasec-casc:0.1.0
  CONFIG: aqua/policies      # the folder with aquasec-casc.yaml and the policies

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate
        run: docker run --rm --network none -v "$PWD/$CONFIG:/config:ro" "$IMAGE" validate -f /config

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Plan
        env:
          AQUA_URL: ${{ secrets.AQUA_URL }}
          AQUA_USER: ${{ secrets.AQUA_READONLY_USER }}
          AQUA_PASSWORD: ${{ secrets.AQUA_READONLY_PASSWORD }}
        run: >
          docker run --rm --read-only -v "$PWD/$CONFIG:/config:ro"
          -e AQUA_URL -e AQUA_USER -e AQUA_PASSWORD
          "$IMAGE" plan -f /config

  apply:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    environment: aqua-production
    # One apply at a time, and always of what main holds when its turn comes. So however
    # GitHub orders the waiting runs or drops one, and however late an approval comes, an
    # older run cannot put older files back. On this job alone, so a pull request's plan
    # cannot push a waiting apply out of the queue.
    concurrency:
      group: aqua-configuration-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Apply
        env:
          AQUA_URL: ${{ secrets.AQUA_URL }}
          AQUA_USER: ${{ secrets.AQUA_USER }}
          AQUA_PASSWORD: ${{ secrets.AQUA_PASSWORD }}
        run: >
          docker run --rm --read-only -v "$PWD/$CONFIG:/config:ro"
          -e AQUA_URL -e AQUA_USER -e AQUA_PASSWORD
          "$IMAGE" apply -f /config
