# Playground policy 3 of 3: every control in the console's list for container
# policies, switched on, in enforce mode.
#
# Safe on any tenant: enabled is false, so the policy exists but does nothing.
# Enabled for real, it would block most workloads (only registered, compliant,
# recent images; no exec; only "cat" may run): it is a reference for what each
# control is called, not a policy to roll out.
#
# Not here, on purpose:
#   Fork Guard, Read-Only Files                 deprecated for containers; Aqua
#                                               refuses Read-Only Files here
#   Bypass Scope                                Aqua's default policies only
apiVersion: config.aquasec.com/v1alpha1
kind: RuntimePolicy
metadata:
  name: casc-playground-all-controls
spec:
  description: aquasec-casc playground -- every control on; safe to delete
  enabled: false                      # inert: change only on a tenant you own
  enforce: true
  runtimeType: container
  applicationScopes:
    - Global
  controls:
    # Images and workloads
    blockNonCompliantImages: true
    blockNonCompliantWorkloads: true
    onlyRegisteredImages: true
    blockNonK8sContainers: true
    # Processes
    blockContainerExec: true
    blockReverseShell: true
    blockFilelessExec: true
    noNewPrivileges: true
    driftPrevention:
      enabled: true
      execLockdown: true
      imageLockdown: true
      execLockdownScripts: true
      inheritToChild: true
    # Network and behaviour
    blockCryptocurrencyMining: true
    enableIpReputation: true
    enablePortScanProtection: true
    auditBruteForceLogin: true

    # --- sections: writing a setting switches the section on -----------------
    limitContainerPrivileges:
      privileged: true
      hostNetwork: true
      hostPid: true
      hostIpc: true
      hostUts: true
      hostUserNamespace: true
      rootUser: true
      lowPortBinding: true
      addCapabilities: true
      ownerUserContext: true
    capabilitiesBlock:
      capabilities: ["NET_RAW", "SYS_ADMIN", "SYS_PTRACE"]
    executablesBlocked:
      executables: ["nc", "ncat", "wget", "curl"]
    executablesAllowed:
      executables: ["cat"]
    registriesAllowed:
      registries: ["Docker Hub"]
    volumesBlocked:
      volumes: ["/", "/boot", "/dev", "/etc", "/proc", "/sys", "/var/run/docker.sock"]
    blockOutdatedImages:
      olderThan: 6
      unit: months
    portBlock:
      inbound: ["22", "23"]
      outbound: ["25", "6667"]
    fileBlock:
      files: ["/etc/shadow", "/root/.ssh/*"]
    packageBlock:
      packages: ["netcat*", "nmap"]
    fileIntegrityMonitoring:
      paths: ["/etc/*", "/bin/*", "/usr/bin/*"]
      exceptions: ["/etc/hosts", "/etc/resolv.conf"]
      monitorCreate: true
      monitorModify: true
      monitorDelete: true
    malwareProtection:
      action: block
      excludeDirectories: ["/proc/*", "/sys/*"]
      fileForensicCollection: true
      memoryDumpCollection: true
    forensics:
      allProcesses: true
      processCommandLine: true
      allNetwork: true
    systemIntegrityMonitoring:
      systemTimeChanges: true
    # Secure AI: audit only. The console switches these off in enforce mode;
    # Aqua keeps them as written, so they are stored as written here too.
    secureAiDiscovery:
      ignore: ["OpenAI@gpt-4o-mini"]   # Service@model; Service@* for all its models
    secureAiUnauthorizedModels:
      models: ["DeepSeek@*", "Inference-Server@*"]
